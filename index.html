<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Blog Card Preview</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Figtree", sans-serif;
        }

        body {
            /* background-color: hsl(47, 88%, 63%);

            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: hsl(47, 88%, 63%);
            font-family: "Figtree", sans-serif;
            color: hsl(0, 0%, 7%);
        }

        .blog-card {
            /* Add your blog card styles here */
          
        
            width: 100%;
            max-width: 24rem;
            padding: 24px;
            background-color: hsl(0, 0%, 100%);
            border: 2px solid black;
            border-radius: 20px;
            box-shadow: 8px 8px 0 black;

        }

        .blog-title {
            margin-top: 16px;
            font-size: 2rem;
            font-weight: 800;
        }

        .tag {

            margin-top: 24px;
            padding: 7px 12px;
            background-color: hsl(47, 88%, 63%);
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 800;

        }

        .published-date {
            /* font-size: 1.2rem;

            margin-top: 12px;

            /* font-size: 1.4rem;

            margin-top: 16px;
            color: hsl(0, 0%, 42%);
            line-height: 1.5;
            font-size: 1.125rem;
        }

        .published-date,
        .tag,
        .author {
            font-size: 1rem;
        }

            

            .topimg {

            height: 280px;

            padding-top: 23px;

                width: 100%;

            }

            .author {

            color: hsl(0, 0%, 7%);
            font-family: "Figtree", sans-serif;
            font-size: 2rem;
            padding-right: 209px;

                display: flex;
                align-items: center;

                margin-top: 24px;
                font-size: 0.875rem;

            }

    <div class="blog-card">
        <img class="topimg" src="illustration-article.svg" alt="">
