<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
       @import url(https://fonts.google.com/specimen/Montserrat);
       @import url(https://fonts.google.com/specimen/Fraunces);

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Montserrat", sans-serif;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: hsl(30, 38%, 92%);
            font-family: "Fraunces", serif;
            color: hsl(0, 0%, 7%);
        }

        header {
            width: 100%;
            max-width: 26rem;
            height: 100%;
            max-height: 40rem;  
            padding: 24px;
            background-color: hsl(0, 0%, 100%);
            border-radius: 20px;
            box-shadow: 8px 8px 0 black;
        }
         
        .card {
            padding: 24px;
        
        }   
        .category {
            color: hsl(228, 12%, 48%);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.1rem;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .product-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            font-family: "Fraunces", serif;
        }

        .description {
            font-size: 1.2rem;
            color: hsl(228, 12%, 48%);
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            font-family: "Fraunces", serif;
        }

        .price {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 20px;
            font-family: "Fraunces", serif;
            display: inline-block;
            padding-right: 27px;
            color: hsl(158, 36%, 37%);
        }

        .price2 {
            font-size: 1.2rem;
            color: hsl(228, 12%, 48%);
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
            font-family: "Fraunces", serif;
            display: inline-block;
            text-decoration: line-through;
        }

        .button:hover {
            background-color: hsl(158, 17%, 91%);
            cursor: pointer;
            font-weight: bold;
        }

        .product-image {
            display: grid;
            width: 48%;
            max-width: 786px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        </style>
</head>
<body>
    <img  class="product-image" src="image.jpg" alt="
        <div class="card">

            <p class="category">Perfume</p>
            
            <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
            
            <p class="description">A floral,solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

            <p class="price" >$149.99</p>
            <p class="price2">$169.99</p>
            <button class="button"  style="width: 100%; padding: 15px; background-color: hsl(158, 36%, 37%); color: white; border: none; border-radius: 10px; font-size: 1.2rem; font-weight: 500; cursor: pointer;"> <img src="cart.svg" alt="Cart"> Add to Cart</button>
        </div>
        
</body>
</html>
