<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data storage component</title>
    <link rel="icon" href="favicon1.png" type="image/x-icon">
    <style>
        @import url(https://fonts.google.com/specimen/Raleway);
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
         body {
            margin: 0;
            height: 100%;
            min-height: 100vh;
            background-image: url(bg.png);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            align-content: center;
            flex-wrap: wrap;
         }


        .page {
            display: flex;
            justify-content: center;
            gap: 40px;
            height: 100%;
            max-height: 100vh;
            width: 100%;

        }

        .icons {
            display:grid;
            justify-self: center;
            align-self: center;
            align-items: center;
             background-color: hsl(228, 56%, 26%);
            color: hsl(243, 100%, 93%);
            font-size: 25px;
            font-family:'Raleway' , sans-serif;
            width: min(14em,70vw);
            height: 6.9em;
            border-radius: 16px;
            border-top-right-radius:86px;
        }

        .icon {
         background-color: hsl(229, 57%, 11%);
         display: grid;
         flex-direction: column;
        }

        .storagebar{
            display: flex;
            justify-self: center;
            align-self: center;
            align-items: center;
            background-color: hsl(228, 56%, 26%);
            color: hsl(243, 100%, 93%);
            font-size: 25px;
            font-family:'Raleway' , sans-serif;
            width: min(28em,70vw);
            height: 6.9em;
            border-radius: 16px;
        }

        .remain {
            font-weight: 790;
        }
    
    </style>
</head>

<body>
    <div class="page">
        
        <div class="icons">
            <img   src="logo.svg" alt="Logo Icon">
            <img class="icon"   src="document.svg" alt="Document Icon">
            <img  class="icon"  src="folder.svg" alt="Folder Icon">
            <img class="icon"   src="upload.svg" alt="Upload Icon">
        </div> 


        <div class="storagebar">
           <p>You've used <span class="remain">815 GB</span> of your storage</p>
        </div>
    </div>
</body>

</html>
